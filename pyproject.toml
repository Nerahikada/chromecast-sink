[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chromecast-sink"
version = "0.1.0"
description = "Use Google Chromecast / Nest as a Linux speaker output via PipeWire virtual sink"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Nerahikada"}]
keywords = ["chromecast", "pipewire", "audio", "linux", "cast", "nest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "PyChromecast>=14.0",
    "zeroconf>=0.80.0",
    "cryptography>=41.0",
]

[project.urls]
Homepage = "https://github.com/Nerahikada/chromecast-sink"
Repository = "https://github.com/Nerahikada/chromecast-sink"
Issues = "https://github.com/Nerahikada/chromecast-sink/issues"

[project.scripts]
chromecast-sink = "chromecast_sink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
