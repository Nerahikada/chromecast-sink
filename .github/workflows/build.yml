name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libopus-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            clang

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: |
          RUSTFLAGS="-L /usr/lib/$(gcc -print-multiarch) -l static=opus" \
            cargo build --release --locked

      # pkg-config also emits `-l dylib=opus`; the build above wins only via linker --as-needed. Guard against a toolchain change that flips the outcome.
      - name: Verify libopus is statically linked
        run: |
          if ldd target/release/chromecast-sink | grep -q libopus; then
            echo "::error::libopus is dynamically linked (expected static)"
            ldd target/release/chromecast-sink
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: chromecast-sink-linux-${{ matrix.arch }}
          path: target/release/chromecast-sink
          if-no-files-found: error
