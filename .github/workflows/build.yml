name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libpulse-dev \
            libopus-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            clang

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: chromecast-sink-linux-x86_64
          path: target/release/chromecast-sink
          if-no-files-found: error
