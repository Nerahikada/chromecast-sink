[package]
name = "chromecast-sink"
version = "0.0.1"
categories = ["multimedia::audio", "command-line-utilities"]
edition = "2021"
keywords = ["chromecast", "cast", "pipewire", "audio", "opus"]
license = "MIT"
repository = "https://github.com/Nerahikada/chromecast-sink"
# Floor set by clap 4.6's edition-2024 deps; verified with `cargo +1.85.0 check`.
rust-version = "1.85"
description = "Use Google Chromecast / Nest devices as speaker output"

[[bin]]
name = "chromecast-sink"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctr = "0.9"
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
hex = "0.4"
log = "0.4"
mdns-sd = "0.13"
opus = "0.3"
rand = "0.9"
# serde comes in transitively and nothing here derives.
serde_json = "1"

[dependencies.rustls]
default-features = false
features = ["ring", "std", "tls12", "logging"]
version = "0.23"

[target.'cfg(not(windows))'.dependencies]
pipewire = "0.10"

[target.'cfg(windows)'.dependencies.windows]
features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
]
version = "0.62"

[dev-dependencies]
hex-literal = "0.4"

[lints.rust]
unsafe_code = "deny"
