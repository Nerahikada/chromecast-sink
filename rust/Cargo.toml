[package]
name = "chromecast-sink"
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
description = "Use Google Chromecast / Nest as a Linux speaker output via PipeWire virtual sink"
license = "MIT"

[[bin]]
name = "chromecast-sink"
path = "src/main.rs"

[dependencies]
# CLI + logging
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"

# Errors
anyhow = "1"
thiserror = "2"

# Cast Streaming crypto and RTP
aes = "0.8"
ctr = "0.9"
rand = "0.9"
hex = "0.4"

# Cast v2 channel (TLS + length-prefixed CastMessage)
native-tls = "0.2"

# JSON for OFFER/ANSWER
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# mDNS discovery
mdns-sd = "0.13"

# libpulse-simple for monitor capture (matches Python side; can revisit later)
libpulse-simple-binding = "2"
libpulse-binding = "2"

# libopus encoder
opus = "0.3"

# pipewire-rs (native in-process node)
pipewire = "0.8"

# Signal handling in orchestrator
libc = "0.2"

[dev-dependencies]
hex-literal = "0.4"
